name: BlueBandMap

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: 25
    MARKETING_VERSION: 0.5.9

packages:
  BlueBandKit:
    path: ../../packages/BlueBandKit
  VietMap:
    url: https://github.com/vietmap-company/maps-sdk-ios.git
    revision: 649eabcb21a36c3d0cfd871c07ccea641924fcdd

targets:
  BlueBandMap:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Adapters
    dependencies:
      - package: BlueBandKit
        product: BlueBandProtocol
      - package: BlueBandKit
        product: BlueBandCrypto
      - package: BlueBandKit
        product: BlueBandCryptoCommonCrypto
      - package: BlueBandKit
        product: BlueBandCore
      - package: BlueBandKit
        product: BlueBandMapCore
      - package: VietMap
        product: VietMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lordierclaw.bluebandmap
        PRODUCT_NAME: BlueBandMap
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: BlueBandMap
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: BlueBandMap uses Bluetooth during active navigation to keep your Xiaomi Smart Band 10 guidance current.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: BlueBandMap uses your location during active navigation, including while iPhone is locked, to keep guidance current on your band.
        INFOPLIST_KEY_UIBackgroundModes: [location, bluetooth-central]
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic

  BlueBandMapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BlueBandMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lordierclaw.bluebandmap.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  BlueBandMap:
    build:
      targets:
        BlueBandMap: all
        BlueBandMapTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - BlueBandMapTests
