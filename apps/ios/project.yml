name: BlueBandMap

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: 7
    MARKETING_VERSION: 0.1.6

packages:
  BlueBandKit:
    path: ../../packages/BlueBandKit

targets:
  BlueBandMap:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Adapters
    dependencies:
      - package: BlueBandKit
        product: BlueBandProtocol
      - package: BlueBandKit
        product: BlueBandCrypto
      - package: BlueBandKit
        product: BlueBandCryptoCommonCrypto
      - package: BlueBandKit
        product: BlueBandCore
      - package: BlueBandKit
        product: BlueBandMapCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lordierclaw.bluebandmap
        PRODUCT_NAME: BlueBandMap
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: BlueBandMap
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: BlueBandMap uses Bluetooth only while open to communicate with your Xiaomi Smart Band 10.
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic

  BlueBandMapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BlueBandMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lordierclaw.bluebandmap.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  BlueBandMap:
    build:
      targets:
        BlueBandMap: all
        BlueBandMapTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - BlueBandMapTests
