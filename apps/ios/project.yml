name: BlueBandMap

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: 31
    MARKETING_VERSION: 0.5.15

packages:
  BlueBandKit:
    path: ../../packages/BlueBandKit
  VietMap:
    url: https://github.com/vietmap-company/maps-sdk-ios.git
    revision: 649eabcb21a36c3d0cfd871c07ccea641924fcdd

targets:
  BlueBandMap:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Adapters
    dependencies:
      - package: BlueBandKit
        product: BlueBandProtocol
      - package: BlueBandKit
        product: BlueBandCrypto
      - package: BlueBandKit
        product: BlueBandCryptoCommonCrypto
      - package: BlueBandKit
        product: BlueBandCore
      - package: BlueBandKit
        product: BlueBandMapCore
      - package: VietMap
        product: VietMap
    info:
      path: Generated/BlueBandMap-Info.plist
      properties:
        CFBundleDisplayName: BlueBandMap
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSBluetoothAlwaysUsageDescription: BlueBandMap uses Bluetooth during active navigation to keep your Xiaomi Smart Band 10 guidance current.
        NSLocationWhenInUseUsageDescription: BlueBandMap uses your location during active navigation, including while iPhone is locked, to keep guidance current on your band.
        NSLocationTemporaryUsageDescriptionDictionary:
          Navigation: Precise location is needed to follow your route and update turns on your band while navigating.
        UIBackgroundModes:
          - location
          - bluetooth-central
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lordierclaw.bluebandmap
        PRODUCT_NAME: BlueBandMap
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic

  BlueBandMapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BlueBandMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lordierclaw.bluebandmap.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  BlueBandMap:
    build:
      targets:
        BlueBandMap: all
        BlueBandMapTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - BlueBandMapTests
