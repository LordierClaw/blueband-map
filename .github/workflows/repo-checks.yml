name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: repo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Same-repository PR commits were already verified by their push run; only
    # fork PRs (which have no push run here) need the pull_request copy.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify changes requiring executable checks
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          heavy=false
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            heavy=true
          else
            while IFS= read -r path; do
              case "$path" in
                docs/*|*.md) ;;
                *) heavy=true ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" HEAD)
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
      - name: Run fast repository checks
        run: make lint
      - name: Run canonical Linux test suites
        if: steps.changes.outputs.heavy == 'true'
        run: make test
      - name: Download and verify pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.0
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --no-banner .
      - name: Upload RPK from canonical test run
        if: steps.changes.outputs.heavy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blueband-map-verified-rpk-${{ github.sha }}
          if-no-files-found: error
          path: apps/band/dist/*.rpk
